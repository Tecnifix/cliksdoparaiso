<!--
  LOGO CLIQUES DO PARAÍSO — assets gerados:
  • public/logo.svg      → logo completa (ícone + wordmark), uso geral
  • public/logo-dark.svg → versão para fundo escuro (wordmark branco)
  • public/favicon.svg   → só o ícone, 32×32
  Reutilize via <Image src="/logo.svg" ... /> ou importe em components/Logo.tsx.
  Paleta: turquesa #14B8C4 · laranja #F2913D · grafite #2B2B2B · branco #FFFFFF
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Ícone: lente de câmera com palmeiras e sol -->
  <g transform="translate(4,8)">
    <!-- Círculo externo da lente -->
    <circle cx="32" cy="32" r="28" stroke="#2B2B2B" stroke-width="1.5"/>
    <!-- Círculo interno (anel) -->
    <circle cx="32" cy="32" r="21" stroke="#2B2B2B" stroke-width="1.5"/>
    <!-- Sol semicircular -->
    <path d="M18 36 Q32 14 46 36" stroke="#F2913D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Palmeira esquerda -->
    <line x1="27" y1="46" x2="27" y2="34" stroke="#2B2B2B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M27 34 Q22 29 17 31" stroke="#14B8C4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M27 34 Q24 27 22 24" stroke="#14B8C4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Palmeira direita -->
    <line x1="37" y1="46" x2="37" y2="34" stroke="#2B2B2B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M37 34 Q42 29 47 31" stroke="#14B8C4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M37 34 Q40 27 42 24" stroke="#14B8C4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Linha do horizonte -->
    <line x1="18" y1="44" x2="46" y2="44" stroke="#F2913D" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="36" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#2B2B2B" font-weight="400">CLIQUES</text>
  <text x="76" y="52" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#2B2B2B" font-weight="400">DO <tspan fill="#14B8C4">PARAÍSO</tspan></text>
</svg>
